<!DOCTYPE html>
<html lang="zh-CN" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <script>if (window.self === window.top) window.location.replace('app.html#ledger');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智装管家 · 智能记账本</title>
    <style>
        :root {
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --radius: 20px;
            --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* ===== 昼夜主题（默认日间，沿用原浅色设计） ===== */
        :root, html[data-theme="light"] {
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(255, 255, 255, 0.65);
            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px rgba(17, 24, 39, 0.08);
            --shadow-hover: 0 18px 48px rgba(17, 24, 39, 0.14);
        }
        html[data-theme="dark"] {
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.55);
            --card-border: rgba(148, 163, 184, 0.16);
            --input-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 8px 32px rgba(2, 6, 23, 0.4);
            --shadow-hover: 0 18px 48px rgba(2, 6, 23, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: transparent !important;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px 140px;
        }

        /* 全局悬浮防伪水印（屏幕与打印双端生效） */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* 利用 SVG Data URI 生成 -45度 浅灰色水印 */
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(200,200) rotate(-45)' opacity='0.08'%3E%3Ctext x='0' y='0' font-family='sans-serif' font-size='22' font-weight='800' fill='%2364748b' text-anchor='middle' alignment-baseline='middle'%3EAI 智装管家 · 专属推演方案%3C/text%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
            background-position: center center;
            z-index: 9999; /* 强制置于所有 UI 元素之上 */
            pointer-events: none; /* 核心：绝不阻挡任何鼠标点击和触摸事件 */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ---------- Header ---------- */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand__eyebrow {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent, #38bdf8);
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .brand__title {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .brand__subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* ---------- Dashboard ---------- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .stat-card__label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card__value {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stat-card--primary .stat-card__value {
            color: var(--accent-strong);
        }

        .stat-card--success .stat-card__value {
            color: var(--success);
        }

        .stat-card--warn .stat-card__value {
            color: var(--warn);
        }

        /* ---------- Progress ---------- */
        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 32px;
        }

        .progress__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress__label {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .progress__percent {
            font-size: 0.875rem;
            font-weight: 800;
            color: var(--accent-strong);
        }

        .progress__bar {
            width: 100%;
            height: 10px;
            background: rgba(203, 213, 225, 0.5);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress__fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8 0%, #0ea5e9 100%);
            border-radius: 999px;
            transition: width 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ---------- Ledger ---------- */
        .ledger {
            margin-bottom: 40px;
        }

        .ledger__title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .ledger-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ledger-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ledger-item__left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .ledger-item__icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .ledger-item__info {
            min-width: 0;
        }

        .ledger-item__meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .ledger-item__date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .ledger-item__tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-strong);
            white-space: nowrap;
        }

        .ledger-item__summary {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ledger-item__amount {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ---------- AI Input ---------- */
        .ai-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border-top: 1px solid var(--card-border);
            box-shadow: 0 -8px 32px rgba(17, 24, 39, 0.06);
            z-index: 100;
        }

        .ai-bar__container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .ai-bar__input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(156, 163, 175, 0.35);
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            outline: none;
            background: var(--input-bg);
            color: var(--text-main);
            transition: var(--transition);
            font-family: inherit;
        }

        .ai-bar__input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .ai-bar__btn {
            flex-shrink: 0;
            border: none;
            border-radius: 16px;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #fff;
            box-shadow: 0 6px 18px rgba(14, 165, 233, 0.3);
            transition: var(--transition);
            font-family: inherit;
        }

        .ai-bar__btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(14, 165, 233, 0.4);
        }

        .ai-bar__btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .ai-bar__hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 640px) {
            body {
                padding: 32px 16px 140px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .stat-card__value {
                font-size: 1.35rem;
            }

            .ledger-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .ledger-item__amount {
                align-self: flex-end;
            }

            .ai-bar__container {
                flex-direction: column;
            }

            .ai-bar__btn {
                width: 100%;
            }
        }

        /* ---------- Print / PDF export ---------- */
        .print-header, .print-footer { display: none; }
        .btn-print-ledger {
            width: 100%; margin-top: 20px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            background: rgba(56, 189, 248, 0.06);
            color: var(--accent-strong);
            font-size: 0.88rem; font-weight: 700; padding: 13px 16px;
            border-radius: 14px; cursor: pointer;
            transition: var(--transition); font-family: inherit;
        }
        .btn-print-ledger:hover { background: rgba(56, 189, 248, 0.12); border-color: var(--accent); }
        .btn-edit-budget { cursor:pointer; opacity:0.5; margin-left:6px; font-size:0.85rem; }
        .btn-edit-budget:hover { opacity:1; }

        @media print {
            @page { size: A4 portrait; margin: 18mm 12mm; }
            *, *::before, *::after {
                animation: none !important; transition: none !important;
                box-shadow: none !important; text-shadow: none !important;
            }
            /* 利用固定定位实现跨页连续页眉页脚 */
            .print-header {
                position: fixed; top: 0; left: 0; right: 0;
                display: flex !important; justify-content: space-between; align-items: flex-end;
                padding-bottom: 10px; border-bottom: 2px solid #555; background: #fff; z-index: 10;
            }
            .print-header__title { font-size: 1.08rem; font-weight: 800; color: #333; }
            .print-header__meta { font-size: 0.72rem; color: #4a4a4a; font-weight: 600; }

            .print-footer {
                position: fixed; bottom: 0; left: 0; right: 0;
                display: block !important; padding-top: 6px; border-top: 1px solid #d8d8d8;
                font-size: 0.62rem; color: #909090; text-align: center; background: #fff; z-index: 10;
            }
            /* CSS计数器页码注入 */
            .print-footer::after { content: "第 " counter(page) " 页"; display: block; margin-top: 4px; font-weight: 700; color: #666; }

            body {
                -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
                background: #fff !important; color: #1f2937 !important;
                /* 留出上下边距防止内容被固定定位的页眉页脚遮挡 */
                padding: 50px 0 40px !important;
            }
            .ai-bar, .btn-print-ledger, #clearLedgerBtn, [data-action="delete-item"] { display: none !important; }
            .container { max-width: 100% !important; margin: 0 !important; }
            .dashboard, .progress-card, .ledger-item {
                background: transparent !important; backdrop-filter: none !important;
                border: 1px solid #e3e3e3 !important; border-radius: 4px !important; break-inside: avoid;
            }
            .ledger-item { opacity: 1 !important; transform: none !important; }
        }

        /* ---------- 模块级高级弹窗 ---------- */
        .global-modal-mask {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(2, 6, 23, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .global-modal-mask.show { opacity: 1; visibility: visible; }
        .global-modal {
            width: 360px; background: var(--card-bg, var(--bg-panel, #fff)); border: 1px solid var(--card-border, var(--border-sub, #ccc));
            border-radius: 18px; padding: 26px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            transform: scale(0.95); transition: var(--transition); color: var(--text-main, var(--text-light, #333));
        }
        .global-modal-mask.show .global-modal { transform: scale(1); }
        .gm-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; }
        .gm-desc { font-size: 0.88rem; color: var(--text-muted, var(--text-dim, #666)); line-height: 1.6; margin-bottom: 24px; }
        .gm-actions { display: flex; gap: 12px; }
        .gm-btn {
            flex: 1; border-radius: 12px; padding: 11px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; border: 1px solid transparent; font-family: inherit; transition: var(--transition);
        }
        .gm-btn--cancel { background: transparent; border-color: rgba(148, 163, 184, 0.3); color: var(--text-muted, var(--text-dim, #666)); }
        .gm-btn--cancel:hover { background: rgba(148, 163, 184, 0.1); color: var(--text-main, var(--text-light, #333)); }
        .gm-btn--danger { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: var(--danger); }
        .gm-btn--danger:hover { background: var(--danger); color: #fff; }
        .gm-input {
            width: 100%; border: 1px solid var(--card-border, var(--border-sub, #ccc));
            border-radius: 12px; padding: 12px 14px; font-size: 1.05rem;
            background: var(--input-bg, transparent); color: var(--text-main, #333);
            outline: none; font-family: inherit; transition: var(--transition);
            margin-bottom: 24px; text-align: center; font-weight: 700;
        }
        .gm-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12); }
        .gm-btn--primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #fff; border: none;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
        }
        .gm-btn--primary:hover { box-shadow: 0 8px 22px rgba(14, 165, 233, 0.4); transform: translateY(-1px); }

        /* ---------- Toast 提示 ---------- */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 9999; background: rgba(15, 23, 42, 0.85); color: #fff;
            padding: 10px 20px; border-radius: 999px; font-size: 0.85rem;
            font-weight: 700; pointer-events: none; white-space: nowrap;
            opacity: 0; transition: opacity 0.3s ease, top 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .toast.show { opacity: 1; top: 32px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Print header (only visible in print) -->
        <div class="print-header">
            <span class="print-header__title">AI 智装管家 · 装修账本报告</span>
            <span class="print-header__meta" id="printMeta"></span>
        </div>

        <!-- Header -->
        <header class="brand">
            <span class="brand__eyebrow">AI 智装管家 · 智能记账本</span>
            <h1 class="brand__title">装修账本</h1>
            <p class="brand__subtitle">一句话让 AI 帮你自动分类、记账、算预算。</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard" aria-label="预算看板">
            <div class="stat-card stat-card--primary">
                <div class="stat-card__label">总预算 <span class="btn-edit-budget" id="editBudgetBtn" title="修改预算">✏️</span></div>
                <div class="stat-card__value" id="totalBudget">¥0</div>
            </div>
            <div class="stat-card stat-card--warn">
                <div class="stat-card__label">已支出</div>
                <div class="stat-card__value" id="totalSpent">¥0</div>
            </div>
            <div class="stat-card stat-card--success">
                <div class="stat-card__label">剩余可用</div>
                <div class="stat-card__value" id="totalRemaining">¥0</div>
            </div>
        </section>

        <!-- Progress -->
        <div class="progress-card">
            <div class="progress__header">
                <span class="progress__label">预算消耗进度</span>
                <span class="progress__percent" id="progressPercent">0%</span>
            </div>
            <div class="progress__bar">
                <div class="progress__fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Ledger -->
        <section class="ledger" aria-label="记账流水">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 class="ledger__title" style="margin-bottom: 0;">记账流水</h2>
                <button id="clearLedgerBtn" type="button" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 5px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s;">🗑️ 清空账单缓存</button>
            </div>
            <div class="ledger-list" id="ledgerList"></div>
        </section>

        <div class="print-footer">AI 智装管家 · 数据仅供装修决策参考 · 生成时间以打印时刻为准</div>

        <button class="btn-print-ledger" id="printLedgerBtn" type="button">🖨️ 打印 / 导出 PDF</button>
    </div>

    <!-- AI Input -->
    <div class="ai-bar">
        <div class="ai-bar__container">
            <input
                type="text"
                class="ai-bar__input"
                id="aiInput"
                placeholder="告诉AI：今天买水泥和沙子花了850..."
                autocomplete="off"
            />
            <button class="ai-bar__btn" id="aiSendBtn" type="button">发送 / 记账</button>
        </div>
        <p class="ai-bar__hint">AI 会自动识别金额、分类并生成记账记录</p>
    </div>

    <div class="global-modal-mask" id="moduleModalMask">
        <div class="global-modal">
            <div class="gm-title">操作确认</div>
            <div class="gm-desc" id="moduleModalDesc">确定要执行此操作吗？</div>
            <div class="gm-actions">
                <button class="gm-btn gm-btn--cancel" onclick="document.getElementById('moduleModalMask').classList.remove('show')" type="button">取消</button>
                <button class="gm-btn gm-btn--danger" id="moduleConfirmBtn" type="button">确定清空</button>
            </div>
        </div>
    </div>

    <div class="global-modal-mask" id="promptModalMask">
        <div class="global-modal">
            <div class="gm-title">修改总预算</div>
            <div class="gm-desc" style="margin-bottom: 14px;">请输入新的全屋总装修预算（单位：元）</div>
            <input type="number" id="promptInput" class="gm-input" placeholder="例如：300000" autocomplete="off">
            <div class="gm-actions">
                <button class="gm-btn gm-btn--cancel" onclick="document.getElementById('promptModalMask').classList.remove('show')" type="button">取消</button>
                <button class="gm-btn gm-btn--primary" id="promptConfirmBtn" type="button">确认修改</button>
            </div>
        </div>
    </div>

    <div class="toast" id="sysToast"></div>

    <script>
        // ========== 主题同步：读取本地缓存 + 监听父框架 postMessage 广播 ==========
        (function initThemeSync() {
            const THEME_KEY = 'shp_theme';
            function applyTheme(theme) { document.documentElement.dataset.theme = theme; }
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'light' || saved === 'dark') applyTheme(saved);
            } catch (e) {}
            window.addEventListener('message', (e) => {
                if (e.data && (e.data.theme === 'light' || e.data.theme === 'dark')) applyTheme(e.data.theme);
            });
        })();

        // ---------- Data & State ----------
        let BUDGET = parseInt(localStorage.getItem('shp_ledger_budget')) || 300000;

        // ---------- Toast 工具函数 ----------
        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('sysToast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        const LEDGER_STORAGE_KEY = 'shp_ledger_state_v1';
        const defaultTransactions = [
            { id: 1, date: '2026-07-27', category: '硬装', subcategory: '水电改造', summary: '水电改造材料与人工', amount: 5000, icon: '🔧' },
            { id: 2, date: '2026-07-28', category: '家电', subcategory: '洗碗机', summary: '洗碗机采购', amount: 4500, icon: '🍽️' }
        ];
        let transactions = [];
        try {
            const saved = localStorage.getItem(LEDGER_STORAGE_KEY);
            transactions = saved ? JSON.parse(saved) : [...defaultTransactions];
        } catch (e) {
            transactions = [...defaultTransactions];
        }
        const saveLedgerState = () => {
            try { localStorage.setItem(LEDGER_STORAGE_KEY, JSON.stringify(transactions)); } catch (e) {}
        };

        // ---------- DOM refs ----------
        const elTotalBudget = document.getElementById('totalBudget');
        const elTotalSpent = document.getElementById('totalSpent');
        const elTotalRemaining = document.getElementById('totalRemaining');
        const elProgressPercent = document.getElementById('progressPercent');
        const elProgressFill = document.getElementById('progressFill');
        const elLedgerList = document.getElementById('ledgerList');
        const elInput = document.getElementById('aiInput');
        const elBtn = document.getElementById('aiSendBtn');

        // ---------- Helpers ----------
        const formatCurrency = (num) => {
            return '¥' + num.toLocaleString('zh-CN');
        };

        const getIcon = (category) => {
            const map = {
                '硬装': '🔧',
                '软装': '🛋️',
                '家电': '❄️',
                '家具': '🪑',
                '灯具': '💡',
                '卫浴': '🚿',
                '门窗': '🚪',
                '其他': '📝'
            };
            return map[category] || '📝';
        };

        const getTagColor = (category) => {
            const colors = {
                '硬装': { bg: 'rgba(56, 189, 248, 0.1)', text: '#0ea5e9' },
                '软装': { bg: 'rgba(139, 92, 246, 0.1)', text: '#7c3aed' },
                '家电': { bg: 'rgba(16, 185, 129, 0.1)', text: '#059669' },
                '家具': { bg: 'rgba(245, 158, 11, 0.1)', text: '#d97706' },
                '灯具': { bg: 'rgba(245, 158, 11, 0.1)', text: '#d97706' },
                '卫浴': { bg: 'rgba(14, 165, 233, 0.1)', text: '#0284c7' },
                '门窗': { bg: 'rgba(99, 102, 241, 0.1)', text: '#4f46e5' },
                '其他': { bg: 'rgba(107, 114, 128, 0.1)', text: '#4b5563' }
            };
            return colors[category] || colors['其他'];
        };

        // ---------- Render ----------
        const escapeHtml = (str) => {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };

        const renderDashboard = () => {
            const spent = transactions.reduce((sum, t) => sum + t.amount, 0);
            const remaining = BUDGET - spent;
            const percent = Math.min((spent / BUDGET) * 100, 100);

            elTotalBudget.textContent = formatCurrency(BUDGET);
            elTotalSpent.textContent = formatCurrency(spent);
            elTotalRemaining.textContent = formatCurrency(remaining);
            elProgressPercent.textContent = percent.toFixed(1) + '%';
            elProgressFill.style.width = percent + '%';
        };

        const createLedgerItem = (t) => {
            const item = document.createElement('div');
            item.className = 'ledger-item';

            const tagColor = getTagColor(t.category);

            item.innerHTML = `
                <div class="ledger-item__left">
                    <div class="ledger-item__icon">${escapeHtml(t.icon)}</div>
                    <div class="ledger-item__info">
                        <div class="ledger-item__meta">
                            <span class="ledger-item__date">${t.date}</span>
                            <span class="ledger-item__tag" style="background:${tagColor.bg};color:${tagColor.text}">
                                ${escapeHtml(t.category)} · ${escapeHtml(t.subcategory)}
                            </span>
                        </div>
                        <div class="ledger-item__summary">${escapeHtml(t.summary)}</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="ledger-item__amount">${formatCurrency(t.amount)}</div>
                    <button type="button" data-action="delete-item" data-id="${t.id}" style="border:none; background:transparent; cursor:pointer; font-size:0.9rem; opacity:0.6; transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'" title="删除该笔账单">🗑️</button>
                </div>
            `;

            return item;
        };

        const renderLedger = () => {
            elLedgerList.innerHTML = '';
            transactions.slice().reverse().forEach(t => {
                elLedgerList.appendChild(createLedgerItem(t));
            });
        };

        const updateUI = () => {
            renderDashboard();
            renderLedger();
        };

        // ---------- AI Parser (已废弃：前端模拟解析，改由后端大模型 API 接管) ----------
        /*
        const parseInput = (text) => {
            const normalized = text.trim();
            if (!normalized) return null;

            // Try to extract the last number as amount
            const numberMatches = normalized.match(/\d+(?:\.\d+)?/g);
            let amount = numberMatches ? Math.max(...numberMatches.map(Number)) : 0;

            // Category detection
            const rules = [
                { key: ['水电', '水泥', '沙子', '瓷砖', '地板', '油漆', '木工', '吊顶', '防水'], category: '硬装', subcategory: '装修材料' },
                { key: ['洗碗', '冰箱', '洗衣机', '家电', '电视', '空调'], category: '家电', subcategory: '家电采购' },
                { key: ['沙发', '床', '桌椅', '柜子', '家具', '床垫'], category: '家具', subcategory: '家具采购' },
                { key: ['灯', '灯具', '照明'], category: '灯具', subcategory: '灯具照明' },
                { key: ['马桶', '淋浴', '卫浴', '龙头'], category: '卫浴', subcategory: '卫浴洁具' },
                { key: ['门', '窗', '门窗'], category: '门窗', subcategory: '门窗定制' },
                { key: ['窗帘', '地毯', '装饰', '挂画'], category: '软装', subcategory: '软装布置' }
            ];

            const category = matched ? matched.category : '其他';
            const subcategory = matched ? matched.subcategory : '通用支出';

        */

        // ---------- Send Handler（接入后端大模型 API） ----------
        const handleSend = async () => {
            if (elBtn.disabled) return; // 防抖：阻止并发点击
            const rawText = elInput.value.trim();
            if (!rawText) return;

            // 1. 按钮加载态
            const originalText = elBtn.textContent;
            elBtn.disabled = true;
            elBtn.textContent = 'AI 思考中...';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/parse-ledger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: rawText })
                });

                // 第一道防线：HTTP 层错误（如 400 敏感词/长度限制拦截）
                if (!response.ok) {
                    let errMsg = `服务异常 (${response.status})，请稍后重试`;
                    try {
                        const errData = await response.json();
                        if (errData && errData.detail) errMsg = errData.detail;
                    } catch (e) {}
                    showToast(errMsg);
                    return;
                }

                const data = await response.json();

                // 第二/三道防线：业务层错误（大模型判定非记账场景）
                if (data.status === 'error') {
                    showToast(data.msg || 'AI 无法识别该笔账单，请换个说法试试');
                    return;
                }

                // 成功入账
                if (data.status === 'success') {
                    transactions.push({
                        id: Date.now(),
                        date: new Date().toISOString().split('T')[0],
                        category: data.category || '其他',
                        subcategory: data.subcategory || '通用支出',
                        summary: data.summary || 'AI 自动识别支出',
                        amount: Number(data.amount) || 0,
                        icon: getIcon(data.category)
                    });
                    saveLedgerState();
                    updateUI();
                    elInput.value = ''; // 仅入账成功才清空输入框，失败时保留便于修改重试
                }
            } catch (err) {
                // 网络层异常（后端未启动 / CORS / 断网）
                showToast('无法连接 AI 服务，请检查后端是否已启动');
            } finally {
                // 无论成败，恢复按钮状态
                elBtn.disabled = false;
                elBtn.textContent = originalText;
            }
        };

        // ---------- Events ----------
        elBtn.addEventListener('click', handleSend);
        elInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // ---------- Init ----------
        updateUI();

        // ---------- 高级弹窗 Helper ----------
        let currentConfirmAction = null;
        document.getElementById('moduleConfirmBtn').addEventListener('click', () => {
            document.getElementById('moduleModalMask').classList.remove('show');
            if (currentConfirmAction) currentConfirmAction();
        });
        function customConfirm(desc, action) {
            document.getElementById('moduleModalDesc').innerHTML = desc;
            currentConfirmAction = action;
            document.getElementById('moduleModalMask').classList.add('show');
        }

        document.getElementById('clearLedgerBtn').addEventListener('click', () => {
            customConfirm('确定要清空所有账单并删除本地缓存吗？此操作不可撤销。', () => {
                localStorage.removeItem(LEDGER_STORAGE_KEY);
                transactions = [];
                updateUI();
            });
        });

        // ---------- 自定义总预算 ----------
        const promptModalMask = document.getElementById('promptModalMask');
        const promptInput = document.getElementById('promptInput');
        const promptConfirmBtn = document.getElementById('promptConfirmBtn');

        document.getElementById('editBudgetBtn').addEventListener('click', () => {
            promptInput.value = BUDGET; // 回填当前预算
            promptModalMask.classList.add('show');
            setTimeout(() => promptInput.focus(), 100); // 自动聚焦
        });

        const handleBudgetSubmit = () => {
            const val = parseInt(promptInput.value, 10);
            if (!(val > 0)) {
                showToast('输入无效，预算必须为正整数');
                return;
            }
            BUDGET = val;
            try { localStorage.setItem('shp_ledger_budget', String(val)); } catch (e) {}
            updateUI();
            promptModalMask.classList.remove('show');
        };

        promptConfirmBtn.addEventListener('click', handleBudgetSubmit);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleBudgetSubmit();
        });
        // 点击遮罩层关闭
        promptModalMask.addEventListener('click', (e) => {
            if (e.target === promptModalMask) promptModalMask.classList.remove('show');
        });

        // ---------- 单条账单删除（事件委托） ----------
        elLedgerList.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action="delete-item"]');
            if (!btn) return;
            const id = Number(btn.dataset.id);
            transactions = transactions.filter(t => t.id !== id);
            saveLedgerState();
            updateUI();
        });

        // ---------- Print ----------
        document.getElementById('printLedgerBtn').addEventListener('click', () => {
            const now = new Date();
            document.getElementById('printMeta').textContent =
                `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日`;
            window.print();
        });
    </script>
</body>
