<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>if (window.self === window.top) window.location.replace('app.html#compare');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智装管家 · 选材决策参数库</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --accent: #38bdf8;
            --transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* ===== 昼夜主题（默认夜间） ===== */
        :root, html[data-theme="dark"] {
            --bg-deep: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.4);
            --border: rgba(148, 163, 184, 0.14);
            --text-light: #cbd5e1;
            --text-dim: #94a3b8;
            --text-faint: #64748b;
        }
        html[data-theme="light"] {
            --bg-deep: #edf1f8;
            --bg-card: rgba(255, 255, 255, 0.5);
            --border: rgba(15, 23, 42, 0.1);
            --text-light: #334155;
            --text-dim: #475569;
            --text-faint: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        html { background: transparent !important; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex; background: transparent !important; color: var(--text-light);
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        /* 项目统一水印 */
        body::after {
            content: ""; position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(200,200) rotate(-45)' opacity='0.08'%3E%3Ctext x='0' y='0' font-family='sans-serif' font-size='22' font-weight='800' fill='%2364748b' text-anchor='middle' alignment-baseline='middle'%3EAI 智装管家 · 专属推演方案%3C/text%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat; background-position: center center;
            z-index: 9999; pointer-events: none;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }

        /* ================= 分类导航：横向滚动 Pill Tabs ================= */
        #catNav {
            display: flex; flex-direction: row; gap: 12px;
            overflow-x: auto; padding-bottom: 4px;
            max-width: 100%; margin-bottom: 26px;
            scrollbar-width: thin;
        }
        #catNav::-webkit-scrollbar { height: 6px; }
        #catNav::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
        .nav-item {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border-radius: 999px; white-space: nowrap;
            color: var(--text-dim); font-size: 0.85rem; font-weight: 700;
            cursor: pointer; user-select: none; border: 1px solid var(--border);
            background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            transition: var(--transition); font-family: inherit; flex-shrink: 0;
        }
        .nav-item:hover { color: var(--text-light); border-color: rgba(56, 189, 248, 0.35); }
        .nav-item.active {
            color: var(--accent); background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.18);
        }
        .nav-item__icon { font-size: 1rem; }
        .nav-item__meta { min-width: 0; }
        .nav-item__name { line-height: 1; }
        .nav-item__desc { display: none; }

        /* ================= 右侧：主内容 PK 台 ================= */
        .main {
            flex: 1; overflow-y: auto; padding: 38px 46px 64px;
            background: transparent;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .brand { max-width: 100%; margin-bottom: 30px; text-align: center; }
        .brand__eyebrow {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            /* 统一使用全局强调色变量，并配合半透明背景 */
            color: var(--accent, #38bdf8);
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .brand__title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; margin-top: 8px; }
        .brand__subtitle { color: var(--text-dim); font-size: 0.9rem; margin-top: 8px; line-height: 1.7; }

        /* 知识库面板整体：分类切换时的淡出/位移过渡 */
        .pk-panel { max-width: 100%; transition: opacity 0.26s ease, transform 0.26s ease; }
        .pk-panel.is-switching { opacity: 0; transform: translateY(16px); }

        /* ---------- 通用区块标题 ---------- */
        .kb-section { margin-bottom: 26px; }
        .kb-section__title {
            font-size: 0.8rem; font-weight: 800; color: var(--text-dim);
            letter-spacing: 0.1em; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        /* ---------- 引言区：主色背景 + 顶部高光 ---------- */
        .intro-box {
            position: relative; overflow: hidden;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 18px; padding: 22px 26px;
            font-size: 0.98rem; line-height: 1.9; color: var(--text-light);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .intro-box::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 45%);
        }
        html[data-theme="light"] .intro-box::before {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0) 45%);
        }

        /* ---------- 术语解析卡片网格 ---------- */
        .term-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .term-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px 22px;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            transition: var(--transition);
        }
        .term-card:hover { transform: translateY(-3px); border-color: rgba(56, 189, 248, 0.4); }
        .term-name { font-size: 1.05rem; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
        .term-value {
            display: inline-block; font-size: 0.66rem; font-weight: 700;
            color: var(--text-dim); background: rgba(148, 163, 184, 0.12);
            border: 1px solid var(--border); padding: 3px 10px;
            border-radius: 999px; margin: 9px 0 11px;
        }
        .term-desc { font-size: 0.85rem; line-height: 1.8; color: var(--text-dim); }

        /* ---------- 材料对比表格：咨询报告式底线分隔 ---------- */
        .compare-table {
            width: 100%; border-collapse: collapse;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .compare-table th {
            font-size: 0.72rem; font-weight: 800; color: var(--text-faint);
            letter-spacing: 0.08em; text-align: left;
            padding: 14px 18px; border-bottom: 2px solid var(--border);
        }
        .compare-table td {
            padding: 16px 18px; border-bottom: 1px solid var(--border);
            font-size: 0.85rem; line-height: 1.8; vertical-align: top;
        }
        .compare-table tr:last-child td { border-bottom: none; }
        .ct-type { font-weight: 800; color: var(--text-light); white-space: nowrap; font-size: 0.9rem; }
        .ct-pros { color: #10b981; }
        .ct-cons { color: #f87171; }
        .ct-scene { color: var(--text-dim); }

        /* ---------- 注意事项列表：按 ✅/❌ 着色 ---------- */
        .tips-list { display: flex; flex-direction: column; gap: 12px; }
        .tip-item {
            border-radius: 14px; padding: 15px 20px;
            font-size: 0.88rem; line-height: 1.8; font-weight: 600;
            border: 1px solid transparent;
        }
        .tip-item--good { background: rgba(16, 185, 129, 0.09); border-color: rgba(16, 185, 129, 0.24); color: #34d399; }
        .tip-item--bad { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.22); color: #f87171; }
        html[data-theme="light"] .tip-item--good { color: #047857; }
        html[data-theme="light"] .tip-item--bad { color: #b91c1c; }

        /* ================= 移动端 ================= */
        @media (max-width: 860px) {
            body { overflow: auto; }
            .main { padding: 24px 18px 48px; overflow: visible; }
            .compare-table { display: block; overflow-x: auto; white-space: normal; }
            .term-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <!-- ===== 主内容：PK 台 ===== -->
    <main class="main">
        <div class="container">
            <header class="brand">
                <span class="brand__eyebrow">AI 智装管家 · 建材科普知识库</span>
                <h1 class="brand__title">硬核建材科普与知识库</h1>
                <p class="brand__subtitle">国标参数解析 · 材料优劣横评 · 一线选购注意事项。切换上方类目，把装修水最深的材料一次讲透。</p>
            </header>

            <!-- 分类导航：横向滚动 Pill Tabs -->
            <div id="catNav"></div>

            <section class="pk-panel" id="pkPanel"></section>
        </div>
    </main>

    <script>
        // ========== 主题同步：读取本地缓存 + 监听父框架 postMessage 广播 ==========
        (function initThemeSync() {
            const THEME_KEY = 'shp_theme';
            function applyTheme(theme) { document.documentElement.dataset.theme = theme; }
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'light' || saved === 'dark') applyTheme(saved);
            } catch (e) {}
            window.addEventListener('message', (e) => {
                if (e.data && (e.data.theme === 'light' || e.data.theme === 'dark')) applyTheme(e.data.theme);
            });
        })();

        // ============================================================
        // 建材知识库数据：国标术语 + 优缺点横评 + 选购注意事项
        // ============================================================
        const KNOWLEDGE_DATA = [
            {
                id: 'craft', icon: '📏', category: '施工工艺与工法', desc: '找平工艺与落地效果',
                intro: '三分材料七分工。再顶级的建材，如果找平工艺不达标，全屋定制收口和灯光效果都会大打折扣。',
                terms: [
                    { name: '墙面顺平', value: '常规找平工艺', desc: '顺着墙面原有的起伏进行找平，保证局部平整，用长靠尺测量没有明显的坑洼。成本较低，适合贴墙纸或刷常规哑光乳胶漆。' },
                    { name: '墙面垂平 (冲筋打点)', value: '极简风必备工艺', desc: '不仅要求表面绝对平整，还要求墙面绝对垂直于地面，阴阳角绝对方正（90度）。材料与人工成本极高。这是做无主灯洗墙灯、极简隐形门、全屋定制严丝合缝不打胶的必要前提。' },
                    { name: '水泥自流平', value: '高精度地面找平', desc: '利用特种水泥加水混合后，依靠重力自由流动自动找平地面的工艺。厚度通常在 3-5mm，常用于铺贴微水泥、高端超薄木地板前的高精度找平。' }
                ],
                compare: [
                    { type: '顺平 vs 垂平', pros: '顺平施工快、造价低，满足90%的刚需装修；垂平能让墙面如镜面般平直，定制柜可以做到真正的“无缝贴合”。', cons: '顺平在洗墙灯下会暴露出波浪纹，定制柜边缘易留大缝；垂平造价极高（通常大几十到上百元/平米），且严重吃房间尺寸（墙面会变厚2-4cm）。', scene: '预算有限做顺平；无主灯设计、法式/极简风必做局部垂平' },
                    { type: '传统厚找平 vs 自流平', pros: '传统水泥砂浆厚找平（>2cm）便宜，适合填补大落差；自流平精度极高，平整度绝佳。', cons: '自流平对原基层要求高，施工不当极易开裂起壳，需严格涂刷界面剂封底。', scene: '厚找平用于铺常规厚度瓷砖/地板；自流平用于直铺微水泥或悬浮拼装地板' }
                ],
                tips: [
                    '✅ 注意点：如果要做全屋定制（尤其是无把手、一门到顶的柜子），安装柜子的那一面墙和两侧的阴角，必须强制要求油漆工做“冲筋垂平”处理。',
                    '❌ 误区：全屋所有墙面都要做冲筋垂平。没必要！预算有限的话，只在“定制柜靠墙处”、“装洗墙灯的背景墙”、“装极简踢脚线的位置”做局部垂平即可，其余区域顺平能省下一大笔钱。',
                    '✅ 注意点：做水泥自流平前，原地面必须清理干净并涂刷界面剂（墙固/地固），否则自流平极易由于基层吸水过快导致严重开裂。'
                ]
            },
            {
                id: 'tile', icon: '🪨', category: '瓷砖与石材', desc: '国标参数与分类解析',
                intro: '瓷砖选购水极深，不要只看花色，核心要看物理性能检测报告，认准 GB/T 4100-2015 国家标准。',
                terms: [
                    { name: '吸水率 (E)', value: '核心防污抗冻指标', desc: '吸水率越低，密度越高，越不易渗污。国标规定：瓷质砖 E≤0.5%，炻瓷砖 0.5%<E≤3%。地砖务必选择 E≤0.5% 的纯瓷质砖；厨卫墙砖可选吸水率稍高的陶质砖（需泡水铺贴）以免脱落。' },
                    { name: '莫氏硬度', value: '防刮花能力', desc: '数值为 1-10。优秀的抛釉砖莫氏硬度应达到 5-6，能抵抗日常鞋底夹带的泥沙摩擦。' },
                    { name: '防滑系数', value: '涉水安全指标', desc: '认准 R 级防滑标准。干区可选 R9，厨卫及阳台涉水区域强烈建议选择 R10 甚至 R11 级别的柔面防滑砖。' }
                ],
                compare: [
                    { type: '抛釉砖', pros: '花色极多，光泽度高，易打理，性价比最高。', cons: '表面釉层较薄，重物砸落易崩瓷露底。', scene: '客餐厅地面、背景墙' },
                    { type: '通体大理石', pros: '表里如一，拉槽、倒角切割后侧面依然有纹理。', cons: '造价偏高，对铺贴平整度要求极高。', scene: '全屋通铺、楼梯踏步、需倒角处' },
                    { type: '微水泥 / 柔光砖', pros: '漫反射不刺眼，质感极其高级，法式/侘寂风首选。', cons: '表面有微小孔隙，极易渗入污渍（如酱油、茶水），打理成本高。', scene: '卧室、纯设计导向的客餐厅' }
                ],
                tips: [
                    '✅ 注意点：买砖时必须向商家索要“检验报告”，查看放射性核素限量是否为“A类”（可在室内无限量使用）。',
                    '✅ 注意点：优等品 > 一等品 > 合格品。购买时合同里必须写明“保证广东原产优等品”，提货时核对纸箱外包装的等级与色号标识。',
                    '❌ 误区：盲目追求大板（如 750×1500mm 以上）。大板材料贵、人工贵、搬运损耗大，客餐厅面积小于 30㎡ 铺大板反而显拥挤，800×800mm 性价比最高。'
                ]
            },
            {
                id: 'board', icon: '🪵', category: '定制板材', desc: '环保等级与基材剖析',
                intro: '全屋定制是甲醛释放的重灾区。基材决定物理稳定性，胶水与封边决定环保性。',
                terms: [
                    { name: '环保等级', value: 'GB/T 39600-2021', desc: '新国标强制要求：E1级≤0.124mg/m³。更高级别：E0级≤0.050mg/m³，ENF级≤0.025mg/m³（目前全球最严苛）。家用建议起步 E0，预算充足首选 ENF 级，并认准 MDI 无醛生态胶。' },
                    { name: '封边工艺', value: '锁住甲醛防潮湿', desc: '激光封边 > PUR 封边 > EVA 封边。激光封边无胶线，浑然一体；PUR 胶量少且防水防潮好，性价比最高；EVA 胶线明显，易发黄发黑。' }
                ],
                compare: [
                    { type: '颗粒板 (刨花板)', pros: '抗变形能力极强，握钉力优秀，极易做超高门板（一门到顶）。', cons: '防潮性最差，绝对不能泡水。', scene: '衣柜柜体、超高柜门、干燥区域' },
                    { type: '多层实木板', pros: '防潮性优秀，承重能力强，不易受潮膨胀。', cons: '由于胶水层多，环保控制难度高于颗粒板；且极易因应力不均发生翘曲变形，做柜门必须加拉直器。', scene: '橱柜柜体、浴室柜、承重层板' },
                    { type: '欧松板 (OSB)', pros: '结构稳定性强，承重变形极小，MDI 胶常用于此板材环保极佳。', cons: '切面粗糙，对加工锯片与封边机要求极高。', scene: '高端柜门、承重结构件' }
                ],
                tips: [
                    '✅ 注意点：商家口中的“生态板”通常指的是大芯板（细木工板），其握钉力和抗变形能力最差，极易变形，谨慎用于全屋定制柜门。',
                    '✅ 注意点：关注板材品牌的防伪溯源。知名板材（如万华、爱格、克诺斯邦）均可通过紫外线紫光灯照射板材截面，或扫描二维码查验真伪。'
                ]
            },
            {
                id: 'aux', icon: '🧱', category: '泥瓦辅材', desc: '水泥 / 砖 / 腻子',
                intro: '辅材是房屋的骨骼与皮肤，被埋在深处，一旦选错或者用错标号，后期开裂脱落将无法补救。',
                terms: [
                    { name: '水泥标号', value: '凝结强度指标', desc: '家装通常使用 P.O 42.5 或 P.C 32.5 标号水泥。42.5 表示 28 天抗压强度需达到 42.5 MPa。铺地砖宜用 32.5 搭配沙子；贴墙砖如用 42.5 水泥极易因收缩力过大导致瓷砖被拉裂。' },
                    { name: '耐水腻子', value: '防霉抗碱第一道防线', desc: '符合 JG/T 298-2010《建筑室内用腻子》的 N 型（耐水型）腻子。遇水不粉化、不掉粉。强烈建议全屋使用耐水腻子，特别是南方沿海（回南天）及一楼住户。' }
                ],
                compare: [
                    { type: '标准红砖 (粘土砖)', pros: '抗压强度极高，隔音效果好，防水防潮。', cons: '自重大，增加楼板负荷；多地出于环保已限制生产粘土砖。', scene: '卫生间沉箱回填、新建承重隔墙' },
                    { type: '轻质砖 (加气混凝土)', pros: '极轻，隔热保温效果好，施工速度快，不增加楼板负担。', cons: '吸水率极高，握钉力极差，膨胀螺丝挂不住重物。', scene: '室内非承重分隔墙、客餐厅隔断' },
                    { type: '瓷砖背胶', pros: '极大增强瓷砖与墙面的粘结力，防止空鼓脱落。', cons: '刷涂后需严格遵守表干时间，且不能替代水泥砂浆。', scene: '全瓷/低吸水率墙砖上墙必选' }
                ],
                tips: [

                    '❌ 误区：预埋网线可以转直角弯。网线（特别是带屏蔽层的六类线）非常脆弱，强行折死角会破坏内部绞距，直接导致千兆掉百兆。',
                    '✅ 注意点：电视背景墙、书房书桌下，一定要至少预留 2 根网线（一根接主设备，一根备用或作 IPTV），成本极低但能解决大麻烦。'
                ]
            }
        ];

        // ============================================================
        // DOM 引用与状态
        // ============================================================
        const catNav = document.getElementById('catNav');
        const pkPanel = document.getElementById('pkPanel');
        let currentCat = parseInt(localStorage.getItem('shp_compare_cat')) || 0;
        if (currentCat >= KNOWLEDGE_DATA.length) currentCat = 0;
        let switching = false; // 防止过渡期间重复触发

        // ============================================================
        // 分类导航渲染
        // ============================================================
        function buildNav() {
            catNav.innerHTML = KNOWLEDGE_DATA.map((d, i) => `
                <button class="nav-item${i === currentCat ? ' active' : ''}" type="button" data-idx="${i}">
                    <span class="nav-item__icon">${d.icon}</span>
                    <span class="nav-item__meta">
                        <div class="nav-item__name">${d.category}</div>
                        <div class="nav-item__desc">${d.desc}</div>
                    </span>
                </button>
            `).join('');
        }

        function updateNavActive() {
            catNav.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.idx, 10) === currentCat);
            });
        }

        // ============================================================
        // 知识库面板渲染：引言 → 术语网格 → 对比表格 → 避坑指南
        // ============================================================
        function renderPanel(data) {
            const termsHtml = data.terms.map(t => `
                <div class="term-card">
                    <div class="term-name">${t.name}</div>
                    <div class="term-value">${t.value}</div>
                    <div class="term-desc">${t.desc}</div>
                </div>
            `).join('');

            const compareRows = data.compare.map(c => `
                <tr>
                    <td class="ct-type">${c.type}</td>
                    <td class="ct-pros">${c.pros}</td>
                    <td class="ct-cons">${c.cons}</td>
                    <td class="ct-scene">${c.scene}</td>
                </tr>
            `).join('');

            const tipsHtml = data.tips.map(tip => {
                const cls = tip.includes('✅') ? 'tip-item--good' : (tip.includes('❌') ? 'tip-item--bad' : '');
                return `<div class="tip-item ${cls}">${tip}</div>`;
            }).join('');

            pkPanel.innerHTML = `
                <div class="intro-box kb-section">${data.intro}</div>

                <div class="kb-section">
                    <div class="kb-section__title">📖 国标术语解析</div>
                    <div class="term-grid">${termsHtml}</div>
                </div>

                <div class="kb-section">
                    <div class="kb-section__title">⚖️ 主流材料优劣横评</div>
                    <table class="compare-table">
                        <thead>
                            <tr>
                                <th>材料类型</th>
                                <th>优势</th>
                                <th>劣势</th>
                                <th>适用场景</th>
                            </tr>
                        </thead>
                        <tbody>${compareRows}</tbody>
                    </table>
                </div>

                <div class="kb-section">
                    <div class="kb-section__title">🛡️ 选购注意事项</div>
                    <div class="tips-list">${tipsHtml}</div>
                </div>
            `;
        }

        // ============================================================
        // 分类切换：淡出 → 换数据 → 淡入
        // ============================================================
        function switchCategory(idx) {
            if (idx === currentCat || switching) return;
            switching = true;
            currentCat = idx;
            try { localStorage.setItem('shp_compare_cat', idx); } catch(e) {}
            updateNavActive();

            pkPanel.classList.add('is-switching');
            setTimeout(() => {
                renderPanel(KNOWLEDGE_DATA[idx]);
                pkPanel.classList.remove('is-switching');
                switching = false;
            }, 270); // 与 .pk-panel 过渡时长对齐
        }

        // 事件委托：分类点击
        catNav.addEventListener('click', (e) => {
            const btn = e.target.closest('.nav-item');
            if (!btn) return;
            switchCategory(parseInt(btn.dataset.idx, 10));
        });

        // ============================================================
        // 初始化
        // ============================================================
        buildNav();
        renderPanel(KNOWLEDGE_DATA[currentCat]);
    </script>
</body>
